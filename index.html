<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studuj.tech - Školský portál</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 16px;
      --accent-grade: #4f46e5;
    }

    body.light-theme {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    body.light-theme header { background: rgba(255, 255, 255, 0.8); }

    .logo { font-size: 1.35rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 0.75rem; }
    .logo i { color: var(--primary); font-size: 1.5rem; }

    .header-actions { display: flex; gap: 0.75rem; align-items: center; }
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.6rem; border-radius: 10px; cursor: pointer; }

    .nav-btn {
      background: var(--primary); color: white; border: none; padding: 0.6rem 1.25rem; border-radius: 10px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .btn-logout { background: #ef4444; }

    main { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }

    .hero {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: white; padding: 2.5rem; border-radius: var(--radius); margin-bottom: 2rem;
    }

    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
    @media (max-width: 768px) { .controls { grid-template-columns: 1fr; } }

    input, select, textarea {
      width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border); border-radius: 10px;
      background: var(--card-bg); color: var(--text); font-size: 0.95rem; outline: none;
    }

    .admin-panel {
      background: var(--card-bg); border: 2px solid var(--primary); border-radius: var(--radius); padding: 2rem; margin-bottom: 2rem; display: none;
    }
    .admin-panel.active { display: block; }

    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.75rem; }

    .card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem;
      display: flex; flex-direction: column; justify-content: space-between; position: relative;
    }

    .badges { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .badge { font-size: 0.7rem; font-weight: 700; padding: 0.3rem 0.6rem; border-radius: 6px; text-transform: uppercase; }
    .badge-class { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .badge-subject { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

    .btn-download {
      display: inline-flex; align-items: center; gap: 0.5rem; background: #2563eb; color: white;
      text-decoration: none; padding: 0.6rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; margin-top: 1rem;
    }

    .card-footer { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); grid-column: 1 / -1; font-size: 1.1rem; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 400px; }
  </style>
</head>
<body class="light-theme">

  <header>
    <div class="logo">
      <i class="fa-solid fa-graduation-cap"></i> Studuj.tech
    </div>
    <div class="header-actions">
      <button class="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-sun" id="themeIcon"></i></button>
      <button class="nav-btn" id="loginBtn" onclick="openLoginModal()"><i class="fa-solid fa-lock"></i> Učiteľ</button>
      <button class="nav-btn btn-logout" id="logoutBtn" style="display: none;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Odhlásiť</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 id="heroTitle">Školské materiály & Zadania</h1>
      <p id="heroSubtitle">Vyberte svoju triedu pre zobrazenie aktuálnych učebných podkladov.</p>
    </section>

    <!-- FORMULÁR PRE UČITEĽA (Upload Súboru) -->
    <section id="adminPanel" class="admin-panel">
      <h2 style="margin-bottom: 1rem;"><i class="fa-solid fa-cloud-arrow-up"></i> Pridať materiál s prílohou</h2>
      <form id="noteForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <input type="text" id="title" placeholder="Názov lekcie / učiva" required>
          
          <select id="class" required>
            <option value="">Vyberte triedu</option>
            <option value="1.A">1.A</option><option value="1.B1">1.B1</option><option value="1.B2">1.B2</option><option value="1.C">1.C</option><option value="1.D">1.D</option>
            <option value="2.A">2.A</option><option value="2.B1">2.B1</option><option value="2.B2">2.B2</option><option value="2.C">2.C</option><option value="2.D">2.D</option><option value="2.E">2.E</option>
            <option value="3.A">3.A</option><option value="3.B1">3.B1</option><option value="3.B2">3.B2</option><option value="3.C">3.C</option><option value="3.D">3.D</option><option value="3.E">3.E</option>
            <option value="4.A">4.A</option><option value="4.B1">4.B1</option><option value="4.B2">4.B2</option><option value="4.C">4.C</option><option value="4.D">4.D</option><option value="4.E">4.E</option>
          </select>

          <select id="subject" required>
            <option value="">Vyberte predmet</option>
            <option value="Matematika">Matematika</option>
            <option value="Fyzika">Fyzika</option>
            <option value="Dejepis">Dejepis</option>
            <option value="Slovenský jazyk">Slovenský jazyk</option>
            <option value="Informatika">Informatika</option>
          </select>
        </div>

        <textarea id="content" rows="3" placeholder="Popis / Pokyny..." required style="margin-bottom: 1rem;"></textarea>

        <!-- UPLOAD SÚBORU Z POČÍTAČA -->
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem;">Priložiť súbor z počítača (PDF, DOCX, Obrázok...)</label>
          <input type="file" id="fileInput" style="background: transparent; border: none; padding: 0;">
        </div>

        <button type="submit" class="nav-btn"><i class="fa-solid fa-plus"></i> Publikovať materiál</button>
      </form>
    </section>

    <!-- FILTRE (TRIEDA JE POVINNÁ PRE ŽIAKA) -->
    <section class="controls">
      <select id="filterClass" onchange="renderNotes()" style="border: 2px solid var(--primary); font-weight: bold;">
        <option value="">-- ZVOĽTE SVOJU TRIEDU --</option>
        <option value="1.A">1.A</option><option value="1.B1">1.B1</option><option value="1.B2">1.B2</option><option value="1.C">1.C</option><option value="1.D">1.D</option>
        <option value="2.A">2.A</option><option value="2.B1">2.B1</option><option value="2.B2">2.B2</option><option value="2.C">2.C</option><option value="2.D">2.D</option><option value="2.E">2.E</option>
        <option value="3.A">3.A</option><option value="3.B1">3.B1</option><option value="3.B2">3.B2</option><option value="3.C">3.C</option><option value="3.D">3.D</option><option value="3.E">3.E</option>
        <option value="4.A">4.A</option><option value="4.B1">4.B1</option><option value="4.B2">4.B2</option><option value="4.C">4.C</option><option value="4.D">4.D</option><option value="4.E">4.E</option>
      </select>

      <select id="filterSubject" onchange="renderNotes()">
        <option value="">Všetky predmety</option>
        <option value="Matematika">Matematika</option>
        <option value="Fyzika">Fyzika</option>
        <option value="Dejepis">Dejepis</option>
        <option value="Slovenský jazyk">Slovenský jazyk</option>
        <option value="Informatika">Informatika</option>
      </select>

      <input type="text" id="search" placeholder="🔍 Vyhľadať v lekciách..." oninput="renderNotes()">
    </section>

    <section id="notesContainer" class="notes-grid"></section>
  </main>

  <!-- MODAL PRIHLÁSENIE -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Prihlásenie učiteľa</h3>
      <input type="password" id="adminPasswordInput" placeholder="Heslo" style="margin-bottom: 1rem;">
      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button onclick="closeLoginModal()">Zrušiť</button>
        <button onclick="login()" class="nav-btn">Prihlásiť sa</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://studuj-backend.onrender.com/api/notes';
    let notes = [];
    let adminPassword = localStorage.getItem('adminPassword') || '';

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      document.getElementById('themeIcon').className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    async function fetchNotes() {
      try {
        const response = await fetch(API_URL);
        if (response.ok) {
          notes = await response.json();
          renderNotes();
        }
      } catch (err) {
        console.error('Chyba:', err);
      }
    }

    function checkAdminState() {
      if (adminPassword) {
        document.getElementById('adminPanel').classList.add('active');
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'flex';
      } else {
        document.getElementById('adminPanel').classList.remove('active');
        document.getElementById('loginBtn').style.display = 'flex';
        document.getElementById('logoutBtn').style.display = 'none';
      }
      renderNotes();
    }

    function renderNotes() {
      const container = document.getElementById('notesContainer');
      const selectedClass = document.getElementById('filterClass').value;
      const filterSubject = document.getElementById('filterSubject').value;
      const search = document.getElementById('search').value.toLowerCase();

      // Ak je užívateľ ŽIAK (nie je prihlásený admin) a NEMA VYBRANÚ TRIEDU -> Zobraz výzvu
      if (!selectedClass && !adminPassword) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-school" style="font-size: 3rem; margin-bottom: 1rem; color: var(--primary);"></i><br>
            <strong>Prosím, vyberte svoju triedu hore vo filtri.</strong><br>
            <span style="font-size: 0.9rem;">Po výbere sa vám okamžite zobrazia zadania pre vašu triedu.</span>
          </div>
        `;
        return;
      }

      const filtered = notes.filter(n => {
        const matchesClass = !selectedClass || n.class === selectedClass;
        const matchesSubject = !filterSubject || n.subject === filterSubject;
        const matchesSearch = !search || (n.title && n.title.toLowerCase().includes(search));
        return matchesClass && matchesSubject && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">Žiadne materiály pre túto triedu.</div>`;
        return;
      }

      container.innerHTML = filtered.map(n => `
        <div class="card">
          <div>
            <div class="badges">
              <span class="badge badge-class">${n.class}</span>
              <span class="badge badge-subject">${n.subject}</span>
            </div>
            <h3>${n.title}</h3>
            <p>${n.content}</p>

            ${n.file_url ? `
              <a href="${n.file_url}" target="_blank" class="btn-download">
                <i class="fa-solid fa-file-arrow-down"></i> Stiahnuť prílohu
              </a>
            ` : ''}
          </div>
          <div class="card-footer">
            <span>${new Date(n.created_at).toLocaleDateString('sk-SK')}</span>
            ${adminPassword ? `<button onclick="deleteNote(${n.id})" style="color:#ef4444; border:none; background:none; cursor:pointer;"><i class="fa-solid fa-trash"></i> Zmazať</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }

    async function login() {
      const pwd = document.getElementById('adminPasswordInput').value;
      const res = await fetch('https://studuj-backend.onrender.com/api/verify-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });

      if (res.ok) {
        adminPassword = pwd;
        localStorage.setItem('adminPassword', pwd);
        closeLoginModal();
        checkAdminState();
      } else {
        alert('Nesprávne heslo!');
      }
    }

    function logout() {
      adminPassword = '';
      localStorage.removeItem('adminPassword');
      checkAdminState();
    }

    // ODOSLANIE FORMULÁRA S PRIAMYM UPLOADOM SÚBORU (FormData)
    document.getElementById('noteForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('class', document.getElementById('class').value);
      formData.append('subject', document.getElementById('subject').value);
      formData.append('content', document.getElementById('content').value);
      formData.append('password', adminPassword);

      const fileInput = document.getElementById('fileInput');
      if (fileInput.files[0]) {
        formData.append('file', fileInput.files[0]);
      }

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: formData // Priamy multipart upload súboru
        });

        if (response.ok) {
          await fetchNotes();
          e.target.reset();
          alert('Materiál aj so súborom bol úspešne publikovaný!');
        } else {
          alert('Chyba pri ukladaní.');
        }
      } catch (err) {
        alert('Server neodpovedá.');
      }
    });

    async function deleteNote(id) {
      if (!confirm('Naozaj zmazať?')) return;
      const res = await fetch(`${API_URL}/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword })
      });
      if (res.ok) fetchNotes();
    }

    checkAdminState();
    fetchNotes();
  </script>
</body>
</html>
