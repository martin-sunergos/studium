<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studuj.tech - Moderný portál pre štúdium</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { 
      font-size: 1.35rem; 
      font-weight: 700; 
      color: var(--text); 
      display: flex; 
      align-items: center; 
      gap: 0.75rem; 
    }
    .logo i { color: var(--primary); font-size: 1.5rem; }

    .nav-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .nav-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

    main { max-width: 1200px; margin: 2.5rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }

    .hero {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: white;
      padding: 3rem 2.5rem;
      border-radius: var(--radius);
      margin-bottom: 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.2);
    }
    .hero h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 0.75rem; }
    .hero p { font-size: 1.05rem; opacity: 0.9; max-width: 600px; line-height: 1.6; }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    @media (max-width: 768px) { .controls { grid-template-columns: 1fr; } }

    input, select, textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0,0,0,0.3); border-color: rgba(79, 70, 229, 0.4); }

    .badges { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-class { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .badge-subject { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

    .card h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text); }
    .card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
    
    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Modálne okno */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal.active { display: flex; }
    
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-header h2 { font-size: 1.5rem; font-weight: 600; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--primary-hover); }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); grid-column: 1 / -1; font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-graduation-cap"></i> Studuj.tech
    </div>
    <button class="nav-btn" onclick="openModal()">
      <i class="fa-solid fa-plus"></i> Pridať poznámku
    </button>
  </header>

  <main>
    <section class="hero">
      <h1>Školské materiály & Zadania</h1>
      <p>Vyberte svoju triedu a predmet pre zobrazenie aktuálnych učebných poznámok a úloh na jednom mieste.</p>
    </section>

    <section class="controls">
      <input type="text" id="search" placeholder="🔍 Vyhľadať v poznámkach..." oninput="renderNotes()">
      
      <select id="filterClass" onchange="renderNotes()">
        <option value="">Všetky triedy</option>
        <option value="5.A">5.A</option>
        <option value="6.B">6.B</option>
        <option value="7.A">7.A</option>
        <option value="8.C">8.C</option>
        <option value="9.A">9.A</option>
      </select>

      <select id="filterSubject" onchange="renderNotes()">
        <option value="">Všetky predmety</option>
        <option value="Matematika">Matematika</option>
        <option value="Fyzika">Fyzika</option>
        <option value="Dejepis">Dejepis</option>
        <option value="Slovenský jazyk">Slovenský jazyk</option>
        <option value="Informatika">Informatika</option>
      </select>
    </section>

    <section id="notesContainer" class="notes-grid">
      <!-- Poznámky sa sem vygenerujú pomocou JavaScriptu -->
    </section>
  </main>

  <!-- MODÁLNE OKNO -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Pridať novú poznámku</h2>
        <button style="background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer;" onclick="closeModal()">&times;</button>
      </div>
      <form id="noteForm">
        <div class="form-group">
          <label>Názov témy / lekcie</label>
          <input type="text" id="title" placeholder="napr. Pythagorasova veta" required>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Trieda</label>
            <select id="class" required>
              <option value="5.A">5.A</option>
              <option value="6.B">6.B</option>
              <option value="7.A">7.A</option>
              <option value="8.C">8.C</option>
              <option value="9.A">9.A</option>
            </select>
          </div>
          <div class="form-group">
            <label>Predmet</label>
            <select id="subject" required>
              <option value="Matematika">Matematika</option>
              <option value="Fyzika">Fyzika</option>
              <option value="Dejepis">Dejepis</option>
              <option value="Slovenský jazyk">Slovenský jazyk</option>
              <option value="Informatika">Informatika</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Obsah poznámky / Pokyny pre žiakov</label>
          <textarea id="content" rows="4" placeholder="Zhrnutie učiva, domáca úloha..." required></textarea>
        </div>

        <div class="form-group">
          <label>Admin heslo (iba pre učiteľa)</label>
          <input type="password" id="adminPassword" placeholder="Zadajte heslo pre zverejnenie" required>
        </div>

        <button type="submit" class="btn-submit">Uložiť a zverejniť</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'https://studuj-backend.onrender.com/api/notes';
    let notes = [];

    async function fetchNotes() {
      try {
        const response = await fetch(API_URL);
        if (response.ok) {
          notes = await response.json();
          renderNotes();
        }
      } catch (err) {
        console.error('Chyba pri načítavaní:', err);
      }
    }

    function renderNotes() {
      const container = document.getElementById('notesContainer');
      const search = document.getElementById('search').value.toLowerCase();
      const filterClass = document.getElementById('filterClass').value;
      const filterSubject = document.getElementById('filterSubject').value;

      const filtered = notes.filter(n => {
        const matchesSearch = (n.title && n.title.toLowerCase().includes(search)) || 
                              (n.content && n.content.toLowerCase().includes(search));
        const matchesClass = !filterClass || n.class === filterClass;
        const matchesSubject = !filterSubject || n.subject === filterSubject;
        return matchesSearch && matchesClass && matchesSubject;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-folder-open" style="font-size: 2.5rem; margin-bottom: 0.75rem;"></i><br>Nenašli sa žiadne poznámky.</div>`;
        return;
      }

      container.innerHTML = filtered.map(n => `
        <div class="card">
          <div>
            <div class="badges">
              <span class="badge badge-class">${n.class || '5.A'}</span>
              <span class="badge badge-subject">${n.subject || 'Všeobecné'}</span>
            </div>
            <h3>${n.title}</h3>
            <p>${n.content}</p>
          </div>
          <div class="card-footer">
            <span><i class="fa-regular fa-calendar"></i> ${n.created_at ? new Date(n.created_at).toLocaleDateString('sk-SK') : 'Dnes'}</span>
          </div>
        </div>
      `).join('');
    }

    function openModal() { document.getElementById('modal').classList.add('active'); }
    function closeModal() { document.getElementById('modal').classList.remove('active'); }

    document.getElementById('noteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newNote = {
        title: document.getElementById('title').value,
        class: document.getElementById('class').value,
        subject: document.getElementById('subject').value,
        content: document.getElementById('content').value,
        password: document.getElementById('adminPassword').value
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newNote)
        });

        if (response.ok) {
          await fetchNotes();
          closeModal();
          e.target.reset();
        } else {
          const errData = await response.json();
          alert(errData.error || 'Chyba pri ukladaní.');
        }
      } catch (err) {
        console.error('Chyba:', err);
        alert('Server neodpovedá.');
      }
    });

    fetchNotes();
  </script>
</body>
</html>
