<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studuj.tech - Školský portál</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 16px;
      --accent-grade: #4f46e5;
    }

    body.light-theme {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    /* Farebné témy podľa ročníkov */
    body[data-grade="1"] { --accent-grade: #3b82f6; }
    body[data-grade="2"] { --accent-grade: #10b981; }
    body[data-grade="3"] { --accent-grade: #f59e0b; }
    body[data-grade="4"] { --accent-grade: #ec4899; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; transition: background-color 0.2s, border-color 0.2s; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    body.light-theme header { background: rgba(255, 255, 255, 0.8); }

    .logo { font-size: 1.35rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 0.75rem; }
    .logo i { color: var(--accent-grade); font-size: 1.5rem; }

    .header-actions { display: flex; gap: 0.75rem; align-items: center; }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem;
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-btn {
      background: var(--accent-grade);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-logout { background: #ef4444; }

    main { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }

    .hero {
      background: linear-gradient(135deg, var(--accent-grade) 0%, #3b82f6 100%);
      color: white;
      padding: 2.5rem;
      border-radius: var(--radius);
      margin-bottom: 2rem;
      box-shadow: 0 15px 25px -5px rgba(0,0,0,0.1);
    }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 768px) { .controls { grid-template-columns: 1fr; } }

    input, select, textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .admin-panel {
      background: var(--card-bg);
      border: 2px solid var(--accent-grade);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 2rem;
      display: none;
    }
    .admin-panel.active { display: block; }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card.pinned {
      border: 2px solid var(--accent-grade);
    }

    .pin-badge {
      position: absolute;
      top: -12px;
      right: 15px;
      background: var(--accent-grade);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badges { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-class { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .badge-subject { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

    .card h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; }
    .card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
    
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-actions button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      margin-left: 0.5rem;
      font-size: 0.9rem;
    }
    .card-actions button:hover { color: var(--text); }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-graduation-cap"></i> Studuj.tech
    </div>
    <div class="header-actions">
      <button class="theme-toggle" onclick="toggleTheme()" title="Prepnnúť svetlý/tmavý režim">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
      <div id="authButtons">
        <button class="nav-btn" id="loginBtn" onclick="openLoginModal()">
          <i class="fa-solid fa-lock"></i> Učiteľ
        </button>
        <button class="nav-btn btn-logout" id="logoutBtn" style="display: none;" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Odhlásiť
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 id="heroTitle">Školské materiály & Zadania</h1>
      <p id="heroSubtitle">Vyberte svoju triedu a predmet pre zobrazenie aktuálnych učebných podkladov.</p>
    </section>

    <!-- FORMULÁR PRE UČITEĽA (Pridanie/Úprava) -->
    <section id="adminPanel" class="admin-panel">
      <h2 style="margin-bottom: 1rem;" id="adminFormTitle"><i class="fa-solid fa-pen-to-square"></i> Pridať novú poznámku</h2>
      <form id="noteForm">
        <input type="hidden" id="editNoteId">
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <input type="text" id="title" placeholder="Názov témy / lekcie" required>
          
          <select id="class" required onchange="updateGradeTheme(this.value)">
            <option value="">Vyberte triedu</option>
            <option value="1.A">1.A</option><option value="1.B1">1.B1</option><option value="1.B2">1.B2</option><option value="1.C">1.C</option><option value="1.D">1.D</option>
            <option value="2.A">2.A</option><option value="2.B1">2.B1</option><option value="2.B2">2.B2</option><option value="2.C">2.C</option><option value="2.D">2.D</option><option value="2.E">2.E</option>
            <option value="3.A">3.A</option><option value="3.B1">3.B1</option><option value="3.B2">3.B2</option><option value="3.C">3.C</option><option value="3.D">3.D</option><option value="3.E">3.E</option>
            <option value="4.A">4.A</option><option value="4.B1">4.B1</option><option value="4.B2">4.B2</option><option value="4.C">4.C</option><option value="4.D">4.D</option><option value="4.E">4.E</option>
          </select>

          <select id="subject" required>
            <option value="">Vyberte predmet</option>
            <option value="Matematika">Matematika</option>
            <option value="Fyzika">Fyzika</option>
            <option value="Dejepis">Dejepis</option>
            <option value="Slovenský jazyk">Slovenský jazyk</option>
            <option value="Informatika">Informatika</option>
          </select>
        </div>

        <textarea id="content" rows="3" placeholder="Obsah / Pokyny..." required style="margin-bottom: 1rem;"></textarea>
        <input type="url" id="file_url" placeholder="Odkaz na PDF / Google Drive súbor (nepovinné)" style="margin-bottom: 1rem;">
        
        <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="is_pinned" style="width: auto;"> 📌 Pripnúť oznam na vrch
          </label>
        </div>

        <div style="display: flex; gap: 0.5rem;">
          <button type="submit" class="nav-btn" id="saveNoteBtn"><i class="fa-solid fa-plus"></i> Publikovať materiál</button>
          <button type="button" class="nav-btn" id="cancelEditBtn" style="display: none; background: #64748b;" onclick="resetForm()">Zrušiť úpravu</button>
        </div>
      </form>
    </section>

    <!-- FILTRE -->
    <section class="controls">
      <input type="text" id="search" placeholder="🔍 Vyhľadať..." oninput="renderNotes()">
      
      <select id="filterClass" onchange="onClassFilterChange()">
        <option value="">Všetky triedy</option>
        <option value="1.A">1.A</option><option value="1.B1">1.B1</option><option value="1.B2">1.B2</option><option value="1.C">1.C</option><option value="1.D">1.D</option>
        <option value="2.A">2.A</option><option value="2.B1">2.B1</option><option value="2.B2">2.B2</option><option value="2.C">2.C</option><option value="2.D">2.D</option><option value="2.E">2.E</option>
        <option value="3.A">3.A</option><option value="3.B1">3.B1</option><option value="3.B2">3.B2</option><option value="3.C">3.C</option><option value="3.D">3.D</option><option value="3.E">3.E</option>
        <option value="4.A">4.A</option><option value="4.B1">4.B1</option><option value="4.B2">4.B2</option><option value="4.C">4.C</option><option value="4.D">4.D</option><option value="4.E">4.E</option>
      </select>

      <select id="filterSubject" onchange="renderNotes()">
        <option value="">Všetky predmety</option>
        <option value="Matematika">Matematika</option>
        <option value="Fyzika">Fyzika</option>
        <option value="Dejepis">Dejepis</option>
        <option value="Slovenský jazyk">Slovenský jazyk</option>
        <option value="Informatika">Informatika</option>
      </select>
    </section>

    <section id="notesContainer" class="notes-grid"></section>
  </main>

  <!-- MODAL - PRIHLÁSENIE -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Prihlásenie pre učiteľa</h3>
      <input type="password" id="adminPasswordInput" placeholder="Admin heslo" style="margin-bottom: 1rem;">
      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button onclick="closeLoginModal()" style="padding: 0.5rem 1rem; background: none; border: 1px solid var(--border); color: var(--text); border-radius: 8px; cursor: pointer;">Zrušiť</button>
        <button onclick="login()" class="nav-btn">Prihlásiť sa</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://studuj-backend.onrender.com/api/notes';
    let notes = [];
    let adminPassword = localStorage.getItem('adminPassword') || '';

    // Prepínanie tém
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-theme');
      document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      document.getElementById('themeIcon').classList.toggle('fa-sun', isLight);
      document.getElementById('themeIcon').classList.toggle('fa-moon', !isLight);
    }

    function updateGradeTheme(className) {
      if (!className) {
        document.body.removeAttribute('data-grade');
        return;
      }
      const grade = className.charAt(0);
      document.body.setAttribute('data-grade', grade);
    }

    function onClassFilterChange() {
      const selectedClass = document.getElementById('filterClass').value;
      updateGradeTheme(selectedClass);

      if (selectedClass) {
        document.getElementById('heroTitle').innerText = `Materiály pre triedu ${selectedClass}`;
        document.getElementById('heroSubtitle').innerText = `Zobrazené sú výhradne podklady určené pre žiakov triedy ${selectedClass}.`;
      } else {
        document.getElementById('heroTitle').innerText = `Školské materiály & Zadania`;
        document.getElementById('heroSubtitle').innerText = `Vyberte svoju triedu a predmet pre zobrazenie aktuálnych učebných podkladov.`;
      }
      renderNotes();
    }

    async function fetchNotes() {
      try {
        const response = await fetch(API_URL);
        if (response.ok) {
          notes = await response.json();
          renderNotes();
        }
      } catch (err) {
        console.error('Chyba:', err);
      }
    }

    function checkAdminState() {
      if (adminPassword) {
        document.getElementById('adminPanel').classList.add('active');
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'flex';
      } else {
        document.getElementById('adminPanel').classList.remove('active');
        document.getElementById('loginBtn').style.display = 'flex';
        document.getElementById('logoutBtn').style.display = 'none';
      }
      renderNotes();
    }

    function renderNotes() {
      const container = document.getElementById('notesContainer');
      const search = document.getElementById('search').value.toLowerCase();
      const filterClass = document.getElementById('filterClass').value;
      const filterSubject = document.getElementById('filterSubject').value;

      let filtered = notes.filter(n => {
        const matchesSearch = (n.title && n.title.toLowerCase().includes(search)) || 
                              (n.content && n.content.toLowerCase().includes(search));
        const matchesClass = !filterClass || n.class === filterClass;
        const matchesSubject = !filterSubject || n.subject === filterSubject;
        return matchesSearch && matchesClass && matchesSubject;
      });

      // Zoraďovanie: Pripnuté oznamy idú na vrch
      filtered.sort((a, b) => (b.is_pinned ? 1 : 0) - (a.is_pinned ? 1 : 0));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-folder-open" style="font-size: 2.5rem; margin-bottom: 0.75rem;"></i><br>Nenašli sa žiadne poznámky.</div>`;
        return;
      }

      container.innerHTML = filtered.map(n => `
        <div class="card ${n.is_pinned ? 'pinned' : ''}">
          ${n.is_pinned ? '<div class="pin-badge"><i class="fa-solid fa-thumbtack"></i> Pripnuté</div>' : ''}
          <div>
            <div class="badges">
              <span class="badge badge-class">${n.class || '1.A'}</span>
              <span class="badge badge-subject">${n.subject || 'Všeobecné'}</span>
            </div>
            <h3>${n.title}</h3>
            <p>${n.content}</p>

            ${n.file_url ? `
              <a href="${n.file_url}" target="_blank" class="btn-download">
                <i class="fa-solid fa-file-arrow-down"></i> Stiahnuť prílohu / PDF
              </a>
            ` : ''}
          </div>
          <div class="card-footer">
            <span><i class="fa-regular fa-calendar"></i> ${n.created_at ? new Date(n.created_at).toLocaleDateString('sk-SK') : 'Dnes'}</span>
            <div class="card-actions">
              <button onclick="shareNote('${n.title}', '${n.content}')" title="Kopírovať text"><i class="fa-regular fa-copy"></i></button>
              ${adminPassword ? `
                <button onclick="editNote(${n.id})" title="Upraviť"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteNote(${n.id})" title="Zmazať" style="color:#ef4444;"><i class="fa-solid fa-trash"></i></button>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function shareNote(title, content) {
      navigator.clipboard.writeText(`${title}\n${content}`);
      alert('Text poznámky bol skopírovaný do schránky!');
    }

    function editNote(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;

      document.getElementById('editNoteId').value = note.id;
      document.getElementById('title').value = note.title;
      document.getElementById('class').value = note.class;
      document.getElementById('subject').value = note.subject;
      document.getElementById('content').value = note.content;
      document.getElementById('file_url').value = note.file_url || '';
      document.getElementById('is_pinned').checked = !!note.is_pinned;

      document.getElementById('adminFormTitle').innerHTML = '<i class="fa-solid fa-pen"></i> Upraviť poznámku';
      document.getElementById('saveNoteBtn').innerHTML = '<i class="fa-solid fa-check"></i> Uložiť zmeny';
      document.getElementById('cancelEditBtn').style.display = 'inline-flex';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editNoteId').value = '';
      document.getElementById('noteForm').reset();
      document.getElementById('adminFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Pridať novú poznámku';
      document.getElementById('saveNoteBtn').innerHTML = '<i class="fa-solid fa-plus"></i> Publikovať materiál';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }

    async function login() {
      const pwd = document.getElementById('adminPasswordInput').value;
      try {
        const res = await fetch('https://studuj-backend.onrender.com/api/verify-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });

        if (res.ok) {
          adminPassword = pwd;
          localStorage.setItem('adminPassword', pwd);
          closeLoginModal();
          checkAdminState();
        } else {
          alert('Nesprávne heslo!');
        }
      } catch (err) {
        alert('Chyba pri overovaní.');
      }
    }

    function logout() {
      adminPassword = '';
      localStorage.removeItem('adminPassword');
      checkAdminState();
    }

    document.getElementById('noteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const editId = document.getElementById('editNoteId').value;
      const noteData = {
        title: document.getElementById('title').value,
        class: document.getElementById('class').value,
        subject: document.getElementById('subject').value,
        content: document.getElementById('content').value,
        file_url: document.getElementById('file_url').value,
        is_pinned: document.getElementById('is_pinned').checked,
        password: adminPassword
      };

      const method = editId ? 'PUT' : 'POST';
      const url = editId ? `${API_URL}/${editId}` : API_URL;

      try {
        const response = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(noteData)
        });

        if (response.ok) {
          await fetchNotes();
          resetForm();
        } else {
          alert('Chyba pri ukladaní.');
        }
      } catch (err) {
        alert('Server neodpovedá.');
      }
    });

    async function deleteNote(id) {
      if (!confirm('Naozaj chcete zmazať túto poznámku?')) return;

      try {
        const res = await fetch(`${API_URL}/${id}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword })
        });

        if (res.ok) {
          await fetchNotes();
        } else {
          alert('Chyba pri mazaní.');
        }
      } catch (err) {
        alert('Server neodpovedá.');
      }
    }

    checkAdminState();
    fetchNotes();
  </script>
</body>
</html>
